name: Server + Web Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Server + web version (e.g. 1.2.3, 1.2.3-alpha.1, 1.2.3-rc.2)"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: server-web-release
    cancel-in-progress: false

jobs:
    validate:
        name: Validate the immutable release source
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - name: Validate requested version and tag availability
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  node << 'EOF'
                  const version = process.env.RELEASE_VERSION || '';
                  if (!/^\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)(?:\.[0-9A-Za-z.-]+)?)?$/.test(version) || /dev/i.test(version)) {
                    throw new Error('Invalid release version');
                  }
                  EOF
                  if git show-ref --verify --quiet "refs/tags/server-web-v${RELEASE_VERSION}"; then
                    echo "ERROR: Release tag already exists."
                    exit 1
                  fi

    ci:
        name: Test the selected source and release version
        needs: validate
        uses: ./.github/workflows/ci.yml
        with:
            release_version: ${{ inputs.version }}
        secrets: inherit

    package-server-web:
        name: Package ${{ matrix.edition }} (${{ matrix.target }})
        needs: ci
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      edition: portable
                      target: linux-x64
                    - runner: ubuntu-24.04-arm
                      edition: portable
                      target: linux-arm64
                    - runner: windows-2025
                      edition: portable
                      target: win32-x64
                    - runner: windows-11-arm
                      edition: portable
                      target: win32-arm64
                    - runner: macos-15-intel
                      edition: portable
                      target: darwin-x64
                    - runner: macos-15
                      edition: portable
                      target: darwin-arm64
                    - runner: ubuntu-24.04
                      edition: public
                      target: any
        runs-on: ${{ matrix.runner }}
        env:
            RELEASE_VERSION: ${{ inputs.version }}
            RELEASE_SOURCE_SHA: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Install build dependencies
              run: npm ci
            - name: Apply the tested release version
              run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
              shell: bash
            - name: Build the server-web edition
              run: npm run package:server-web:${{ matrix.edition }}
            - name: Start disposable MariaDB for public installation smoke
              if: matrix.edition == 'public'
              run: |
                  set -euo pipefail
                  docker run -d --name public-smoke-db -p 3306:3306 \
                    -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=surveyor_test \
                    -e MARIADB_USER=surveyor -e MARIADB_PASSWORD=surveyor mariadb:10.11
                  for i in {1..60}; do
                    if docker exec public-smoke-db mariadb-admin ping -uroot -proot --silent; then
                      exit 0
                    fi
                    sleep 2
                  done
                  exit 1
            - name: Verify layout and isolated application startup
              env:
                  TEST_DB_HOST: 127.0.0.1
                  TEST_DB_PORT: 3306
                  TEST_DB_USER: surveyor
                  TEST_DB_PASSWORD: surveyor
                  TEST_DB_NAME: surveyor_test
              run: |
                  set -euo pipefail
                  for directory in artifacts/party-game-server-web-*; do
                    [ -d "$directory" ] || continue
                    npm run package:server-web:smoke -- "$directory"
                  done
              shell: bash
            - name: Archive verified application
              run: |
                  set -euo pipefail
                  for directory in artifacts/party-game-server-web-*; do
                    [ -d "$directory" ] || continue
                    name=$(basename "$directory")
                    tar -czf "artifacts/${name}.tar.gz" -C "$directory" .
                  done
              shell: bash
            - uses: actions/upload-artifact@v4
              with:
                  name: server-web-${{ matrix.edition }}-${{ matrix.target }}
                  path: artifacts/party-game-server-web-*.tar.gz
                  if-no-files-found: error
                  retention-days: 7

    release:
        name: Publish the verified server-web release
        needs: package-server-web
        runs-on: ubuntu-24.04
        env:
            RELEASE_VERSION: ${{ inputs.version }}
            RELEASE_SOURCE_SHA: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - uses: actions/download-artifact@v4
              with:
                  pattern: server-web-*
                  path: artifacts
                  merge-multiple: true
            - name: Verify all seven archive manifests against the tested source
              run: npx ts-node --project tsconfig.server.json tooling/release/verify.ts
            - name: Tag the tested source without moving the branch
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "server-web-v${RELEASE_VERSION}" "${RELEASE_SOURCE_SHA}" -m "Server + Web v${RELEASE_VERSION}"
                  git push origin "refs/tags/server-web-v${RELEASE_VERSION}"
            - name: Create draft with all verified assets
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: server-web-v${{ inputs.version }}
                  name: Server + Web v${{ inputs.version }}
                  prerelease: ${{ contains(inputs.version, '-') }}
                  draft: true
                  files: artifacts/*.tar.gz
                  fail_on_unmatched_files: true
            - name: Publish after all assets have uploaded
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.create_release.outputs.id }}
              run: |
                  set -euo pipefail
                  gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
