name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, dev, ts-migration]
  pull_request:
    branches: [master, dev, ts-migration]
  workflow_call:
    inputs:
      release_version:
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: surveyor_test
          MYSQL_USER: surveyor
          MYSQL_PASSWORD: surveyor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python for the Kodi client
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Apply release version for reusable release CI
        if: ${{ inputs.release_version != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Check formatting
        run: npm run format:check

      - name: Check the native Kodi client
        run: npm run kodi:check

      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MariaDB is up"; break
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done

      #- name: Set permissive SQL mode (match dev)
      #  run: |
      #    mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL sql_mode='';"
      #    # new sessions will inherit GLOBAL; also fix the current runner session:
      #    mysql -h 127.0.0.1 -uroot -proot -e "SET SESSION sql_mode='';"
      #    # sanity check:
      #    mysql -h 127.0.0.1 -uroot -proot -e "SELECT @@GLOBAL.sql_mode AS global_sql_mode, @@SESSION.sql_mode AS session_sql_mode;"

      - name: Create databases and grant privileges
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS surveyor_test;"
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS surveyor_e2e;"
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL ON surveyor_test.* TO 'surveyor'@'%' IDENTIFIED BY 'surveyor';"
          mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL ON surveyor_e2e.* TO 'surveyor'@'%' IDENTIFIED BY 'surveyor';"
          mysql -h 127.0.0.1 -uroot -proot -e "FLUSH PRIVILEGES;"

      - name: Create .env.e2e
        run: |
          cat > .env.e2e <<'EOF'
          NODE_ENV=e2e
          E2E_DEPLOYMENT_MODE=public
          E2E_AUTH_MODE=account
          E2E_HTTP_BIND=127.0.0.1
          E2E_HTTP_PORT=3001
          E2E_PUBLIC_URL=http://127.0.0.1:3001
          E2E_SESSION_SECRET=ci-e2e-session-secret-1234567890
          E2E_OIDC_ENABLED=false
          E2E_SMTP_HOST=smtp.example.test
          E2E_SMTP_PORT=465
          E2E_SMTP_USER=mailer
          E2E_SMTP_PASSWORD=mail-password
          E2E_SMTP_EMAIL=cards@example.test
          E2E_SMTP_SECURE=true
          E2E_TRUST_PROXY=1

          # E2E DB (guard requires name to contain 'e2e')
          E2E_DB_TYPE=mariadb
          E2E_DB_HOST=127.0.0.1
          E2E_DB_PORT=3306
          E2E_DB_USER=surveyor
          E2E_DB_PASSWORD=surveyor
          E2E_DB_NAME=surveyor_e2e

          # Seeded admin for tests
          E2E_ADMIN_USERNAME=tester
          E2E_ADMIN_EMAIL=e2e@example.com
          E2E_ADMIN_PASSWORD=passw0rd!
          EOF
          echo "Wrote .env.e2e"

      - name: Run Vitest unit, frontend, and MariaDB integration suites with reports
        env:
          CARD_CATALOG_MARIADB_TEST: 1
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: 3306
          E2E_DB_USER: surveyor
          E2E_DB_PASSWORD: surveyor
          E2E_DB_NAME: surveyor_e2e
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: surveyor
          TEST_DB_PASSWORD: surveyor
          TEST_DB_NAME: surveyor_test
        run: |
          mkdir -p artifacts
          npm run test:ci

      - name: Build application
        run: npm run build

      - name: Assemble and smoke-test the standalone server-web bundle
        run: |
          set -euo pipefail
          npm run package:server-web:portable
          BUNDLE=$(find artifacts -maxdepth 1 -type d -name 'party-game-server-web-*-portable-*' | head -1)
          if [ -z "${BUNDLE}" ]; then
            echo "Standalone server-web bundle was not created."
            exit 1
          fi
          npm run package:server-web:smoke -- "${BUNDLE}"

      - name: Type-check tests
        run: npm run typecheck:test

      # =========================
      # Playwright E2E
      # =========================
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Repeat timed Couch recovery scenarios without retries
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: artifacts/junit-playwright-recovery.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/playwright-report-recovery
        run: npm run e2e:couch -- --grep "lost committed response|automatically resumes" --repeat-each=5 --retries=0

      - name: Run local Couch and Party Screen Playwright E2E suite
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: artifacts/junit-playwright-couch.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/playwright-report-couch
        run: |
          mkdir -p artifacts
          npm run e2e:couch

      - name: Run public-account Playwright E2E suite
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: artifacts/junit-playwright.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/playwright-report
        run: |
          mkdir -p artifacts
          npm run e2e

      - name: Run desktop and narrow-phone visual audit
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: artifacts/junit-playwright-visual.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/playwright-report-visual
        run: npm run e2e:visual

      - name: Upload test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            artifacts/junit-vitest.xml
            artifacts/junit-playwright.xml
            artifacts/junit-playwright-couch.xml
            artifacts/junit-playwright-recovery.xml
            artifacts/junit-playwright-visual.xml
            artifacts/playwright-report/
            artifacts/playwright-report-couch/
            artifacts/playwright-report-recovery/
            artifacts/playwright-report-visual/
            .tmp/visual-audit/
            coverage/lcov.info
            coverage/coverage-final.json
          retention-days: 7
          compression-level: 9
          include-hidden-files: true # Include the explicitly selected .tmp/visual-audit directory.
          if-no-files-found: warn

      - name: Read package version
        id: package
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.package.outputs.version }}
            -Dsonar.junit.reportPaths=artifacts/junit-vitest.xml,artifacts/junit-playwright.xml,artifacts/junit-playwright-couch.xml
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
